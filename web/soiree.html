<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail de la soirée</title>
    <!-- Même fichier CSS global compilé via nos modules SASS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- En-tête global réutilisé pour la cohérence de navigation -->
    <header class="main-header">
        <div class="logo">NRV</div>

        <button id="burger-btn" class="burger-menu" aria-label="Ouvrir le menu">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        </button>

        <nav id="main-nav">
            <a href="index.html">Programme</a>
            <a href="#">Panier (0)</a>

            <a href="inscription.html" class="btn-primary">S'inscrire</a>
            <a href="connexion.html" class="btn-primary">Se connecter</a>
        </nav>
    </header>

    <!-- Conteneur principal : Gère la mise en page en 2 colonnes sur ordinateur (via Flexbox) et empilée sur mobile -->
    <main class="soiree-container">
        <!-- remplacé par le template ci-dessous une fois la soirée chargée (js/soiree.js) -->
        <p class="chargement">Chargement de la soirée…</p>
    </main>

    <!-- Template Handlebars du détail : {{champ}} est remplacé par la donnée de l'API (texte échappé),
         {{#each}} répète un bloc pour chaque élément, {{else}} s'affiche si la liste est vide -->
    <script id="tpl-soiree" type="text/x-handlebars-template">
        <section class="soiree-info">
            <h1>{{nom}}</h1>
            <ul class="info-list">
                <li><strong>Thématique :</strong> {{thematique}}</li>
                <li><strong>Date et Horaire :</strong> {{dateLongue date}} - {{horaire}}</li>
                <li><strong>Lieu :</strong> {{lieu}}</li>
            </ul>

            <!-- Zone d'action (Call-to-Action) et Tarification -->
            <div class="tarifs-box">
                {{#if tarifs.length}}
                <form id="form-ajout" class="form-ajout">
                    <div class="tarifs-choix" role="radiogroup" aria-label="Choisir un tarif">
                        {{#each tarifs}}
                        <label class="tarif-choix">
                            <input type="radio" name="ajout-tarif" value="{{nom}}" data-prix="{{this.prix}}" {{#if @first}}checked{{/if}}>
                            <span class="tarif-badge">{{nomTarif nom}} : {{prix prix}}</span>
                        </label>
                        {{/each}}
                    </div>

                    <div class="ajout-actions">
                        <div class="quantite-stepper">
                            <button type="button" id="qte-moins" aria-label="Retirer un billet">−</button>
                            <output id="qte-valeur">1</output>
                            <button type="button" id="qte-plus" aria-label="Ajouter un billet">+</button>
                        </div>
                        <button type="submit" id="btn-ajout" class="btn-ajouter-panier">🛒 Ajouter au panier</button>
                    </div>
                </form>
                <p id="ajout-message" hidden></p>
                {{else}}
                <span class="tarif-badge">Billetterie bientôt ouverte</span>
                {{/if}}
            </div>
        </section>

        <section class="spectacles-list">
            <h2>Spectacles de la soirée</h2>

            {{#each spectacles}}
            <!-- Composant "Détail du spectacle" : réutilisable pour l'injection dynamique de données -->
            <article class="spectacle-detail-card">
                <!-- Faux lecteur vidéo (passe de haut en bas sur mobile, à gauche sur PC) -->
                <div class="video-placeholder">
                    {{#if video}}
                        <video class="video" src="{{video}}" controls preload="none"></video>
                    {{else}}
                        <div class="video-placeholder">Vidéo bientôt disponible</div>
                    {{/if}}
                </div>
                <!-- Informations spécifiques au spectacle -->
                <div class="spectacle-info">
                    <h3>{{titre}}</h3>
                    <p class="style-badge">Style : {{styleMusique}}</p>
                    <p><strong>Artistes :</strong> {{join artistes}}</p>
                    {{#if description}}
                        <p class="description">{{description}}</p>
                    {{/if}}
                </div>
            </article>
            {{else}}
                <p>La programmation de cette soirée sera bientôt annoncée.</p>
            {{/each}}
            
        </section>
    </script>

    <!-- Handlebars doit être chargé avant le script de la page qui l'utilise -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/soiree.js"></script>
</body>
</html>
