<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Inscription</title>
</head>
<body>
    <section class="auth-section">
    <h2>Créer un compte</h2>
    
    <!-- Messages gérés via les classes CSS -->
    <div id="register-error" class="message message-error" hidden></div>
    <div id="register-success" class="message message-success" hidden>Inscription réussie !</div>

    <form id="register-form" class="nrv-form">
        <div class="form-group">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" required>
        </div>

        <div class="form-group">
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" required>
        </div>

        <div class="form-group">
            <label for="email">Email :</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" minlength="8" required>
        </div>

        <button type="submit" class="btn-primary">S'inscrire</button>
    </form>
</section>
</section>
</body>
</html>
