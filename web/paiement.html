<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement - NRV</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">NRV</div>
        <button id="burger-btn" class="burger-menu" aria-label="Ouvrir le menu">
            <span class="burger-line"></span>
            <span class="burger-line"></span>
            <span class="burger-line"></span>
        </button>
        <nav id="main-nav">
            <a href="index.html">Programme</a>
            <a href="panier.html">Panier (0)</a>
            <a href="inscription.html" class="btn-primary">S'inscrire</a>
            <a href="connexion.html" class="btn-primary">Se connecter</a>
        </nav>
    </header>

    <main>
        <section class="panier-section">
            <h2>Paiement</h2>
            <div id="message-paiement" class="message message-error" hidden></div>

            <div class="panier-card">
                <h3>Paiement Sécurisé</h3>
                
                <form id="form-paiement" class="form-paiement">
                    <input type="text" id="cb-numero" placeholder="Numéro de carte..." required>
                    
                    <div class="form-row">
                        <input type="text" id="cb-date" placeholder="MM/AA" required>
                        <input type="text" id="cb-cvc" placeholder="CVC" required>
                    </div>

                    <button type="submit" id="btn-payer" class="btn-action btn-bleu">Payer la commande</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/paiement.js"></script>
</body>
</html>
