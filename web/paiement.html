<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">NRV</div>

        <button id="burger-btn" class="burger-menu" aria-label="Ouvrir le menu">
            <span class="burger-line"></span>
            <span class="burger-line"></span>
            <span class="burger-line"></span>
        </button>

        <nav id="main-nav">
            <a href="index.html">Programme</a>
            <a href="panier.html">Panier</a>
            <a href="inscription.html" class="btn-primary">S'inscrire</a>
            <a href="connexion.html" class="btn-primary">Se connecter</a>
        </nav>
    </header>
    <main>
        <section class="panier-section">
            <h2>Paiement</h2>

            <div id="message-paiement" class="message message-error" hidden></div>

            <div class="panier-layout">
                <div class="panier-gauche">
                    <h3>Récapitulatif</h3>
                    <div id="liste-billets" class="liste-billets"></div>
                    <div class="resume-total">
                        <span class="total-label">Total</span>
                        <span class="total-montant" id="total-prix">0,00 €</span>
                    </div>
                </div>

                <div class="panier-droite">
                    <h3>Paiement sécurisé</h3>

                    <form id="form-paiement" class="form-paiement">
                        <input type="text" id="cb-numero" placeholder="Numéro de carte..." inputmode="numeric" autocomplete="cc-number" required>

                        <div class="form-row">
                            <input type="text" id="cb-date" placeholder="MM/AA" autocomplete="cc-exp" required>
                            <input type="text" id="cb-cvc" placeholder="CVC" inputmode="numeric" autocomplete="cc-csc" required>
                        </div>

                        <button type="submit" id="btn-payer" class="btn-payer" disabled>Payer</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
