<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Impression de vos billets - NRV</title>
    <style>
        /* Styles de base de la page */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #eeeeee; 
            padding: 2rem; 
            color: #000; 
        }
        
        /* Zone du bouton d'impression (sera masquée à l'impression) */
        .no-print { 
            text-align: center; 
            margin-bottom: 2rem; 
        }
        .btn-print { 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            background: #ff4757; 
            color: white; 
            border: none; 
            border-radius: 6px; 
        }
        
        /* Disposition en colonne des billets générés */
        #billets-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* Style de la carte d'un billet individuel */
        .billet {
            background: #ffffff;
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem; 
            /* Empêche le navigateur de couper un billet en deux lors d'un saut de page */
            page-break-inside: avoid;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Section gauche du billet : Informations texte */
        .billet-info {
            flex: 1; 
            min-width: 250px;
        }
        .billet-info h2 { 
            margin: 0 0 0.5rem 0; 
            color: #ff4757; 
            font-size: 1.8rem;
            text-transform: uppercase;
        }
        .billet-info h3 {
            margin: 0 0 1rem 0;
            font-size: 1.2rem;
            color: #222;
        }
        .billet-info p { 
            margin: 0.25rem 0; 
            font-size: 1rem;
        }
        
        /* Section droite du billet : QR Code */
        .billet-code {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden; 
        }
        .billet-code img {
            max-width: 100%; 
            height: auto;
            max-height: 90px;
            object-fit: contain;
        }
        
        /* Styles appliqués UNIQUEMENT lors de l'impression physique (Ctrl+P) */
        @media print {
            /* Suppression du fond gris pour économiser l'encre */
            body { background: #ffffff; padding: 0; }
            /* Masquage du bouton web */
            .no-print { display: none; }
            #billets-container { gap: 1rem; }
            /* Remplacement des pointillés par une bordure pleine noire */
            .billet { 
                border: 2px solid #000; 
                box-shadow: none; 
                margin-bottom: 1rem; 
            }
        }
    </style>
</head>
<body>

    <!-- Bouton déclenchant l'impression du navigateur -->
    <div class="no-print">
        <button class="btn-print" onclick="window.print()">🖨️ Lancer l'impression</button>
    </div>

    <!-- Conteneur cible où le JavaScript (billet.js) va injecter les billets générés -->
    <div id="billets-container">
        <p style="text-align: center;">Génération de vos billets en cours...</p>
    </div>

    <!-- Chargement de l'URL de l'API puis du script de génération logicielle -->
    <script src="js/config.js"></script>
    <script src="js/billet.js"></script>
</body>
</html>
