<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">NRV</div>

        <button id="burger-btn" class="burger-menu" aria-label="Ouvrir le menu">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        </button>

        <nav id="main-nav">
            <a href="index.html">Programme</a>
            <a href="panier.html">Panier (0)</a>

            <a href="inscription.html" class="btn-primary">S'inscrire</a>
            <a href="connexion.html" class="btn-primary">Se connecter</a>
        </nav>
    </header>
    <main>

    <section class="panier-section">
    <h2>Panier & Validation</h2>
    
    <div id="message-panier" class="message message-error" hidden></div>

    <div class="panier-layout">
        <!-- COLONNE GAUCHE : La liste des billets -->
        <div class="panier-gauche">
            <h3>Vos billets</h3>
            
            <div id="liste-billets" class="liste-billets"></div>

            <div class="resume-total">
                <span class="total-label">Total</span>
                <span class="total-montant" id="total-prix">0,00 €</span>
            </div>
        </div>

        <!-- COLONNE DROITE : Le formulaire de paiement -->
        <div class="panier-droite">
            <h3>Paiement Sécurisé</h3>
            
            <form id="form-paiement" class="form-paiement">
                <input type="text" id="cb-numero" placeholder="Numéro de carte..." required>
                
                <div class="form-row">
                    <input type="text" id="cb-date" placeholder="MM/AA" required>
                    <input type="text" id="cb-cvc" placeholder="CVC" required>
                </div>

                <button type="submit" id="btn-payer" class="btn-payer" disabled>Payer</button>
            </form>
        </div>
    </div>
</section>

</main>
<script src="js/config.js"></script>
<script src="js/script.js"></script>
<script src="js/panier.js"></script>
</body>
</html>
